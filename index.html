<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Calculadora de Pedidos</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f0f4f8;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }
        .card {
            background: #ffffff;
            width: 100%;
            max-width: 480px;
            padding: 20px 15px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(22, 64, 109, 0.1);
            margin: auto;
        }
        h3 {
            color: #16406d;
            text-align: center;
            margin: 0 0 16px 0;
            font-size: 22px;
            font-weight: 700;
        }
        .input-box { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
        textarea {
            width: 100%;
            height: 80px;
            padding: 12px;
            border: 2px solid #b0bec5;
            border-radius: 10px;
            font-size: 16px;
            resize: none;
            font-family: inherit;
            background: #f8fafc;
            transition: border 0.2s;
        }
        textarea:focus { border-color: #16406d; outline: none; }
        .actions { display: flex; gap: 8px; margin-bottom: 10px; }
        .btn-paste {
            flex: 2;
            background: #16406d;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 12px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
        }
        .btn-paste:active { background: #0f2d4e; }
        .btn-clear {
            flex: 1;
            background: #a62b2b;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 12px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
        }
        .btn-clear:active { background: #822222; }

        .btn-logo {
            width: 100%;
            background: #34495e;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 15px;
        }
        .btn-logo.loaded { background: #27ae60; }

        .item {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            background: #f8fafc;
            padding: 8px 12px;
            margin-bottom: 6px;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
            gap: 6px;
        }
        .item-name {
            flex: 1 1 45%;
            font-size: 15px;
            color: #1d2d44;
            word-break: break-word;
            font-weight: 500;
            min-width: 100px;
        }
        .item-controls {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            flex: 1 1 auto;
            justify-content: flex-end;
        }
        .item-controls input[type="number"] {
            width: 75px;
            padding: 6px 4px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            text-align: right;
            font-size: 16px;
            background: white;
            font-weight: 600;
            color: #16406d;
        }
        .item-controls input[type="number"]:focus { border-color: #16406d; outline: none; }
        .chk {
            transform: scale(1.3);
            cursor: pointer;
            accent-color: #16406d;
            margin-right: 2px;
        }
        .subtotal-item {
            font-size: 14px;
            font-weight: 600;
            color: #16406d;
            background: #e6edf5;
            padding: 2px 10px;
            border-radius: 20px;
            white-space: nowrap;
            min-width: 70px;
            text-align: center;
        }

        .total-row {
            margin-top: 16px;
            padding: 14px 18px;
            background: #a62b2b;
            color: white;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            font-size: 20px;
            box-shadow: 0 4px 10px rgba(166, 43, 43, 0.2);
        }
        .btn-copy {
            width: 100%;
            background: #25D366;
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            margin-top: 16px;
            cursor: pointer;
        }
        .btn-copy:active { background: #1da85c; }
        .btn-copy:disabled { opacity: 0.7; pointer-events: none; }
    </style>
</head>
<body>

<div class="card">
    <h3>📋 Generador de Pedido</h3>

    <button class="btn-logo" id="btnLogoNav" onclick="document.getElementById('fileInput').click()">🖼️ Cargar Logo (Solo 1 vez)</button>
    <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="cargarLogo(event)">

    <div class="input-box">
        <textarea id="txt-in" placeholder="Pega los productos aquí..." oninput="procesar()"></textarea>
        <div class="actions">
            <button class="btn-paste" onclick="pegar()">📋 Pegar</button>
            <button class="btn-clear" onclick="borrarTodo()">🗑 Borrar</button>
        </div>
    </div>

    <div id="lista"></div>

    <div class="total-row">
        <span>TOTAL</span>
        <span id="total-val">Q 0.00</span>
    </div>

    <button class="btn-copy" id="btnCopiar" onclick="copiarImagen()">📸 Copiar Imagen para WhatsApp</button>
</div>

<img id="logoMemoria" style="display:none;">

<script>
    let preciosGuardados = {};

    // Cargar precios desde localStorage al iniciar
    window.addEventListener('DOMContentLoaded', () => {
        const logoGuardado = localStorage.getItem('logoNegocioB64');
        if (logoGuardado) {
            document.getElementById('logoMemoria').src = logoGuardado;
            const btnLogo = document.getElementById('btnLogoNav');
            btnLogo.textContent = "✅ Logo Guardado (Permanente)";
            btnLogo.classList.add('loaded');
        }
        // Recuperar precios guardados
        const preciosAlmacenados = localStorage.getItem('preciosProductos');
        if (preciosAlmacenados) {
            try {
                preciosGuardados = JSON.parse(preciosAlmacenados);
            } catch (e) { preciosGuardados = {}; }
        }
        procesar();
    });

    function cargarLogo(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const base64Data = e.target.result;
                document.getElementById('logoMemoria').src = base64Data;
                localStorage.setItem('logoNegocioB64', base64Data);
                const btnLogo = document.getElementById('btnLogoNav');
                btnLogo.textContent = "✅ Logo Guardado (Permanente)";
                btnLogo.classList.add('loaded');
            }
            reader.readAsDataURL(file);
        }
    }

    async function pegar() {
        try {
            const texto = await navigator.clipboard.readText();
            document.getElementById('txt-in').value = texto;
            procesar();
        } catch (e) {
            alert('No se pudo acceder al portapapeles. Pega manualmente.');
        }
    }

    function borrarTodo() {
        if (confirm('¿Borrar todos los productos y precios?')) {
            document.getElementById('txt-in').value = '';
            preciosGuardados = {};
            localStorage.removeItem('preciosProductos');
            procesar();
        }
    }

    // Guardar precios en localStorage
    function guardarPreciosEnLocal() {
        localStorage.setItem('preciosProductos', JSON.stringify(preciosGuardados));
    }

    function procesar() {
        const texto = document.getElementById('txt-in').value;
        const lineas = texto.split('\n').filter(l => l.trim() !== '');
        const listaDiv = document.getElementById('lista');

        // Guardar precios actuales antes de reconstruir
        document.querySelectorAll('.p-input').forEach(input => {
            if (input.value) {
                preciosGuardados[input.dataset.n] = input.value;
            }
        });
        guardarPreciosEnLocal();

        listaDiv.innerHTML = '';

        lineas.forEach(linea => {
            let cant = 1;
            const m = linea.match(/^(\d+)(?!\/\d)/);
            if (m) cant = parseInt(m[1]);

            const nombreLimpio = linea.replace(/^\d+\s*/, '').trim() || linea;
            const precioPrevio = preciosGuardados[linea] || '';

            const div = document.createElement('div');
            div.className = 'item';
            div.innerHTML = `
                <span class="item-name">${linea}</span>
                <div class="item-controls">
                    <input type="checkbox" class="chk" checked onchange="calc()">
                    <input type="number" class="p-input" step="0.01" placeholder="0.00"
                           value="${precioPrevio}"
                           oninput="calc()"
                           data-n="${linea}" data-c="${cant}">
                    <span class="subtotal-item" id="sub-${linea.replace(/\s/g, '')}">Q 0.00</span>
                </div>
            `;
            listaDiv.appendChild(div);
        });
        calc();
    }

    function calc() {
        let total = 0;
        document.querySelectorAll('.item').forEach(el => {
            const input = el.querySelector('.p-input');
            const precio = parseFloat(input.value) || 0;
            const cant = parseInt(input.dataset.c);
            const multiplicar = el.querySelector('.chk').checked;
            const subtotal = multiplicar ? (precio * cant) : precio;
            
            // Actualizar subtotal visual
            const subtotalSpan = el.querySelector('.subtotal-item');
            if (subtotalSpan) {
                subtotalSpan.textContent = 'Q ' + subtotal.toFixed(2);
            }

            // Guardar precio en memoria y localStorage
            preciosGuardados[input.dataset.n] = input.value;
            total += subtotal;
        });
        document.getElementById('total-val').textContent = 'Q ' + total.toFixed(2);
        guardarPreciosEnLocal();
    }

    function copiarImagen() {
        const items = document.querySelectorAll('.item');
        if (items.length === 0) {
            alert('No hay productos para generar la factura.');
            return;
        }

        let lineasPedido = [];
        let total = 0;
        items.forEach(el => {
            const nom = el.querySelector('.p-input').dataset.n;
            const precio = parseFloat(el.querySelector('.p-input').value) || 0;
            const cant = parseInt(el.querySelector('.p-input').dataset.c);
            const multiplicar = el.querySelector('.chk').checked;
            const sub = multiplicar ? (precio * cant) : precio;

            if (precio > 0) {
                lineasPedido.push({ nombre: nom.trim(), precio: sub });
                total += sub;
            }
        });

        if (lineasPedido.length === 0) {
            alert('No hay productos con precio para generar la factura.');
            return;
        }

        const btn = document.getElementById('btnCopiar');
        btn.disabled = true;
        btn.textContent = '⏳ Generando...';

        requestAnimationFrame(() => {
            try {
                const imgElement = document.getElementById('logoMemoria');
                generarFactura(lineasPedido, total, imgElement.src ? imgElement : null);
            } catch (e) {
                alert('Error al generar: ' + e.message);
            } finally {
                btn.disabled = false;
                btn.textContent = '📸 Copiar Imagen para WhatsApp';
            }
        });
    }

    function generarFactura(lineasPedido, total, logo) {
        const escala = 2;
        const ancho = 600 * escala;
        const margen = 30 * escala;
        const lineHeight = 38 * escala; 
        
        const headerHeight = 140 * escala;  
        const tableHeaderHeight = 40 * escala; 
        const itemHeight = lineasPedido.length * lineHeight;
        const totalSectionHeight = 75 * escala; 
        const footerHeight = 60 * escala;  
        
        const alto = headerHeight + tableHeaderHeight + itemHeight + totalSectionHeight + footerHeight;

        const canvas = document.createElement('canvas');
        canvas.width = ancho;
        canvas.height = alto;
        const ctx = canvas.getContext('2d');

        ctx.scale(escala, escala);

        const grad = ctx.createLinearGradient(0, 0, 0, alto/escala);
        grad.addColorStop(0, '#16406d');
        grad.addColorStop(1, '#2c5d94');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, ancho/escala, alto/escala);

        const cuerpoY = (headerHeight / escala) - 10;
        const cuerpoAltura = (itemHeight + tableHeaderHeight + totalSectionHeight) / escala;
        
        ctx.shadowColor = 'rgba(0,0,0,0.2)';
        ctx.shadowBlur = 15;
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.roundRect(margen/escala, cuerpoY, (ancho/escala) - 2*(margen/escala), cuerpoAltura, 14);
        ctx.fill();
        ctx.shadowBlur = 0;

        const logoSize = 85;
        const logoX = (margen / escala) + 10;
        const logoY = 22;
        
        if (logo && logo.src) {
            ctx.drawImage(logo, logoX, logoY, logoSize, logoSize);
        }

        const textoHeaderX = (logo && logo.src) ? (logoX + logoSize + 15) : (margen / escala) + 15;
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 22px Arial';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText('DETALLE DEL PEDIDO', textoHeaderX, logoY + (logoSize / 2));

        const ahora = new Date();
        const fechaStr = ahora.toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric' });
        const horaStr = ahora.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
        ctx.textAlign = 'right';
        ctx.font = '13px Arial';
        ctx.fillStyle = '#f1c40f'; 
        ctx.fillText(`${fechaStr} ${horaStr}`, (ancho/escala) - (margen/escala) - 10, logoY + 15);

        const colCant = (margen/escala) + 20;
        const colProducto = colCant + 60;
        const colPrecio = (ancho/escala) - (margen/escala) - 20;

        let currentY = cuerpoY + 15;

        ctx.fillStyle = '#16406d';
        ctx.font = 'bold 15px monospace';
        ctx.textAlign = 'left';
        ctx.fillText('Cant', colCant, currentY);
        ctx.fillText('Producto', colProducto, currentY);
        ctx.textAlign = 'right';
        ctx.fillText('Total', colPrecio, currentY);

        currentY += 22;
        ctx.beginPath();
        ctx.moveTo((margen/escala) + 15, currentY);
        ctx.lineTo((ancho/escala) - (margen/escala) - 15, currentY);
        ctx.strokeStyle = '#e2e8f0';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        currentY += 12; 
        ctx.font = '15px monospace';
        
        lineasPedido.forEach(item => {
            let nombre = item.nombre;
            let cant = 1;
            const m = nombre.match(/^(\d+)(?!\/\d)/);
            if (m) {
                cant = parseInt(m[1]);
                nombre = nombre.substring(m[1].length).trim();
            }

            ctx.textAlign = 'left';
            ctx.fillStyle = '#1d2d44';
            ctx.fillText(cant, colCant, currentY);
            ctx.fillText(nombre, colProducto, currentY);

            ctx.textAlign = 'right';
            ctx.fillStyle = '#16406d';
            ctx.font = 'bold 15px monospace';
            ctx.fillText('Q' + item.precio.toFixed(2), colPrecio, currentY);
            ctx.font = '15px monospace';

            currentY += lineHeight/escala;
        });

        ctx.beginPath();
        ctx.moveTo((margen/escala) + 15, currentY);
        ctx.lineTo((ancho/escala) - (margen/escala) - 15, currentY);
        ctx.strokeStyle = '#a62b2b';
        ctx.lineWidth = 2.5;
        ctx.stroke();

        currentY += 15;
        ctx.textAlign = 'right';
        ctx.font = 'bold 24px monospace';
        ctx.fillStyle = '#a62b2b';
        ctx.fillText('TOTAL: Q' + total.toFixed(2), colPrecio, currentY);

        ctx.textAlign = 'center';
        ctx.font = 'bold 14px Arial';
        ctx.fillStyle = '#ffffff';
        ctx.fillText('¡Gracias por su compra!', (ancho/escala)/2, (alto/escala) - 22);

        canvas.toBlob(async (blob) => {
            try {
                await navigator.clipboard.write([
                    new ClipboardItem({ 'image/png': blob })
                ]);
                alert('✅ ¡Factura copiada con éxito! Pégala directamente en WhatsApp.');
            } catch (e) {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'pedido.png';
                a.click();
                URL.revokeObjectURL(url);
                alert('📥 Imagen descargada automáticamente.');
            }
        }, 'image/png');
    }

    if (!CanvasRenderingContext2D.prototype.roundRect) {
        CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
            if (r > w/2) r = w/2;
            if (r > h/2) r = h/2;
            this.moveTo(x + r, y);
            this.lineTo(x + w - r, y);
            this.quadraticCurveTo(x + w, y, x + w, y + r);
            this.lineTo(x + w, y + h - r);
            this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            this.lineTo(x + r, y + h);
            this.quadraticCurveTo(x, y + h, x, y + h - r);
            this.lineTo(x, y + r);
            this.quadraticCurveTo(x, y, x + r, y);
            this.closePath();
            return this;
        };
    }
</script>
</body>
</html>
